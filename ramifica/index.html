<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!--PWA-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0E131D">
<meta name="mobile-web-app-capable" content="yes">
<!--/PWA-->
<title>Ramifica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: canvas infinito de ponta a ponta; com o Fold aberto (>=700px) ganha uma coluna de inspetor à direita; fechado, o inspetor vira folha inferior. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#182033; --muted:#5E6A80;
  --line:#D7DDE7; --dot:#C2C9D6; --accent:#D9466F; --accent-ink:#FFFFFF; --hit:#F2B705;
  --shadow:0 10px 30px rgba(24,32,51,.14), 0 2px 6px rgba(24,32,51,.08);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131D; --surface:#171E2B; --surface-2:#1F2737; --ink:#E8ECF4; --muted:#98A3B7;
  --line:#2B3548; --dot:#283246; --accent:#FF6E94; --accent-ink:#22080F; --hit:#FFD24D;
  --shadow:0 12px 34px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E131D; --surface:#171E2B; --surface-2:#1F2737; --ink:#E8ECF4; --muted:#98A3B7;
  --line:#2B3548; --dot:#283246; --accent:#FF6E94; --accent-ink:#22080F; --hit:#FFD24D;
  --shadow:0 12px 34px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-ui);-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
#app{height:100%;position:relative}
.view{height:100%;display:flex;flex-direction:column}

/* ---------- botões base ---------- */
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:12px;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:disabled{opacity:.3;cursor:default;background:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--accent)}
.btn.ghost{border-style:dashed}
.btn .i{width:20px;height:20px}

/* ---------- início ---------- */
#home{overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home-in{width:100%;max-width:1100px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font:800 30px/1 var(--f-display);letter-spacing:-.02em;margin:0}
.brand .sp{flex:1}
.lede{margin:0;color:var(--muted);max-width:46ch;font-size:16px}
.home-actions{display:flex;flex-wrap:wrap;gap:10px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.banner p{margin:0;flex:1;min-width:200px;color:var(--muted)}
.sec-h{font:600 12px/1 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:6px 0 -8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb{border:0;padding:0;display:block;width:100%;aspect-ratio:16/10;background:var(--surface-2);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:14px 14px}
.thumb svg{width:100%;height:100%;display:block}
.card .meta{display:flex;align-items:center;gap:6px;padding:10px 6px 12px 14px}
.card .meta div{flex:1;min-width:0}
.card .ttl{display:block;border:0;background:none;padding:0;text-align:left;font:700 16px/1.25 var(--f-display);width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tpl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.tpl:hover{border-color:var(--accent)}
.tpl b{font:700 15px/1.2 var(--f-display)}
.tpl span{font-size:13px;color:var(--muted);line-height:1.35}

/* ---------- editor ---------- */
.topbar{display:flex;align-items:center;gap:2px;height:56px;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);flex:none;position:relative;z-index:5}
.map-title{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0 6px;font:700 17px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:44px;border-radius:10px}
.map-title:hover{background:var(--surface-2)}
.workspace{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;min-width:0;position:relative;overflow:hidden;touch-action:none;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px);cursor:grab}
#stage.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges .lnk{stroke:var(--muted);stroke-dasharray:7 7;fill:none;stroke-width:2}

.node{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:240px;padding:8px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--soft);color:var(--ink);font:500 15px/1.3 var(--f-ui);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;user-select:none;-webkit-user-select:none;cursor:pointer;transition:box-shadow .15s}
.node .txt{white-space:pre-wrap;overflow-wrap:anywhere;min-width:1ch;outline:none}
.node .txt:empty::before{content:"Nova ideia";opacity:.45}
.node.d0{max-width:300px;padding:14px 24px;border:0;border-radius:24px;background:var(--c);color:var(--on);font:800 21px/1.15 var(--f-display);letter-spacing:-.01em}
.node.d1{background:var(--tint);border:2px solid var(--c);font-weight:650;font-size:16px;border-radius:14px}
.node.shape-pill{border-radius:999px;padding-inline:18px}
.node.shape-box{border-radius:4px}
.node.shape-plain{background:transparent;border:0;border-bottom:3px solid var(--c);border-radius:0;padding:4px 4px 5px}
.node.d0.shape-plain{color:var(--ink)}
.node.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--accent)}
.node.match{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--hit)}
.node.sel.match{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--accent),0 0 0 9px var(--hit)}
.node.drop{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent);transform:translate(-50%,-50%) scale(1.06)}
.node.dragging{pointer-events:none;opacity:.85;box-shadow:var(--shadow)}
.node.linking{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--muted)}
.node.editing{cursor:text;user-select:text;-webkit-user-select:text}
.node.editing .txt{user-select:text;-webkit-user-select:text}
.node.done .txt{text-decoration:line-through;opacity:.6}
.node .emo{font-size:1.1em;line-height:1}
.node .chk{width:17px;height:17px;border-radius:5px;border:2px solid var(--c);flex:none;display:grid;place-items:center}
.node.done .chk{background:var(--c)}
.node.done .chk::after{content:"";width:8px;height:4px;border-left:2px solid var(--on);border-bottom:2px solid var(--on);transform:translateY(-1px) rotate(-45deg)}
.node .ni{width:14px;height:14px;opacity:.6;stroke-width:2.4}
.node .badge{position:absolute;top:50%;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--c);color:var(--on);font:700 12px/24px var(--f-ui);text-align:center;border:2px solid var(--bg);font-variant-numeric:tabular-nums}
.node .badge.r{right:-14px;transform:translate(50%,-50%)}
.node .badge.l{left:-14px;transform:translate(-50%,-50%)}
.node .badge.b{top:auto;bottom:-14px;left:50%;transform:translate(-50%,50%)}

/* sobreposições no canvas */
.floating{position:absolute;z-index:4}
.fabs{right:max(12px,env(safe-area-inset-right,0px));bottom:16px;display:flex;flex-direction:column;gap:8px;transition:bottom .2s}
#stage.has-sel .fabs{bottom:96px}
.fab{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.fab.zoom{display:none}
@media (pointer:fine){.fab.zoom{display:grid}}
.zoom-pct{font:600 11px/1 var(--f-ui);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
#nodebar{left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);max-width:calc(100% - 20px)}
#nodebar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:52px;height:56px;padding:0 6px;border:0;background:none;border-radius:14px;font:600 11px/1 var(--f-ui);color:var(--ink)}
#nodebar button:hover{background:var(--surface-2)}
#nodebar button:disabled{opacity:.3}
#nodebar button.del{color:var(--accent)}
@media (max-width:380px){#nodebar button{min-width:42px;padding:0 3px}#nodebar button span{font-size:10px}}
#colorpop{left:50%;bottom:90px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);max-width:calc(100% - 20px)}
.sw{width:34px;height:34px;border-radius:50%;border:0;background:var(--sw);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08);position:relative;flex:none;padding:0}
.sw.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--ink)}
.sw.auto{background:conic-gradient(#E2557A,#F08A3E,#D9A423,#3FAE7A,#2F9ED6,#6C63E0,#B05CD6,#E2557A);color:#fff;font:700 12px/34px var(--f-ui)}
.sw.custom{background:var(--surface-2);display:grid;place-items:center;overflow:hidden;cursor:pointer}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sw.custom::before{content:"+";font:600 20px/1 var(--f-ui);color:var(--muted)}
#searchbar{left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;width:min(520px,calc(100% - 20px));padding:4px 4px 4px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
#searchbar input{flex:1;min-width:0;border:0;background:none;height:40px;outline:none;font-size:16px}
#search-count{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
#focusbar{left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;max-width:calc(100% - 20px)}
#focusbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#focusbar button{border:0;border-radius:999px;background:var(--bg);color:var(--ink);font-weight:700;height:32px;padding:0 14px;flex:none}
#searchbar:not([hidden])~#focusbar{top:66px}

/* ---------- painel / folha ---------- */
#panel{background:var(--surface);display:flex;flex-direction:column;min-height:0;z-index:20}
.p-head{display:flex;align-items:center;gap:6px;padding:10px 10px 8px 14px;flex:none}
.tabs{display:flex;flex:1;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2)}
.tabs button{flex:1;height:36px;border:0;border-radius:10px;background:none;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#panel-body{flex:1;overflow-y:auto;padding:6px 16px 24px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.sheet-grab{display:none}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>span,.lbl{font:600 12px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
textarea,input[type=text],input[type=search]{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px 12px;font-size:16px;resize:vertical;outline:none}
textarea:focus,input[type=text]:focus{border-color:var(--accent)}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emo-b{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:19px;display:grid;place-items:center;padding:0}
.emo-b.on{border:2px solid var(--accent);background:var(--surface-2)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);flex-wrap:wrap}
.seg button{flex:1;min-width:70px;height:38px;border:0;border-radius:10px;background:none;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toggle{display:flex;gap:12px;align-items:center;min-height:44px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.actions{display:flex;flex-direction:column;gap:8px}
.actions .btn{justify-content:flex-start}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:30px 10px;color:var(--muted)}
.empty b{color:var(--ink);font:700 17px/1.2 var(--f-display)}
.hint{margin:0;color:var(--muted);font-size:14px}
.links{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--surface-2)}
.lrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .icon-btn{width:36px;height:36px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border-radius:14px;background:var(--surface-2)}
.stat b{display:block;font:800 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.outline{display:flex;flex-direction:column}
.orow{display:flex;align-items:center;gap:6px;min-height:40px;padding:2px 8px 2px calc(var(--d)*18px);border-radius:10px;cursor:pointer}
.orow:hover{background:var(--surface-2)}
.orow.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
.ocaret{width:28px;height:32px;border:0;background:none;color:var(--muted);flex:none;font-size:13px;padding:0}
.odot{width:10px;height:10px;border-radius:50%;flex:none}
.otxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow[style*="--d:0"] .otxt{font:700 16px var(--f-display)}
.onote .i{width:15px;height:15px;color:var(--muted)}
#sheet-backdrop{position:fixed;inset:0;background:rgba(10,14,22,.4);z-index:19;opacity:0;pointer-events:none;transition:opacity .2s}

@media (min-width:700px){
  #panel{width:340px;flex:none;border-left:1px solid var(--line)}
  .workspace.panel-off #panel{display:none}
  #panel-close{display:none}
}
@media (min-width:1100px){#panel{width:380px}}
@media (max-width:699.98px){
  #panel{position:fixed;left:0;right:0;bottom:0;height:min(78%,640px);border-radius:24px 24px 0 0;box-shadow:var(--shadow);transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  #panel.open{transform:none}
  #panel.open~#sheet-backdrop{opacity:1;pointer-events:auto}
  .sheet-grab{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
}
/* Fold em modo "flex" (meio dobrado, como notebook): mapa em cima, painel embaixo */
@media (vertical-viewport-segments:2){
  .workspace{flex-direction:column}
  #stage{flex:none;height:calc(env(viewport-segment-bottom 0 0) - 56px)}
  #panel{position:relative;transform:none;width:auto;height:auto;flex:1;border-radius:0;margin-top:calc(env(viewport-segment-top 0 1) - env(viewport-segment-bottom 0 0))}
}
/* Tela dividida pela dobradiça em duas metades lado a lado */
@media (horizontal-viewport-segments:2){
  #panel{width:calc(env(viewport-segment-right 1 0) - env(viewport-segment-left 1 0));margin-left:calc(env(viewport-segment-left 1 0) - env(viewport-segment-right 0 0))}
}

/* ---------- modal e aviso ---------- */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.45);display:grid;place-items:center;padding:16px}
.dlg{width:min(560px,100%);max-height:min(88vh,760px);display:flex;flex-direction:column;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.dlg.wide{width:min(760px,100%)}
.dlg header{display:flex;align-items:center;gap:8px;padding:14px 8px 6px 20px}
.dlg h2{flex:1;margin:0;font:800 21px/1.2 var(--f-display);text-wrap:balance}
.dlg-body{padding:8px 20px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.dlg-body p{margin:0;color:var(--muted)}
.dlg footer{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px 18px;border-top:1px solid var(--line)}
.menu{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.menu button{display:flex;align-items:center;gap:14px;min-height:50px;padding:0 12px;border:0;border-radius:12px;background:none;text-align:left;font-weight:600}
.menu button:hover{background:var(--surface-2)}
.menu button small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.menu button.danger{color:var(--accent)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 12px}
.dump-tools{display:flex;gap:8px;flex-wrap:wrap}
.dump-tools .btn{min-height:40px;padding:0 12px;font-size:14px}
#dump-text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px;line-height:1.55;min-height:220px;tab-size:2}
.preview-img{max-width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
@media (max-width:520px){#modal{place-items:end stretch;padding:0}.dlg{width:100%;border-radius:24px 24px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,20px);opacity:0;z-index:60;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-weight:500;max-width:calc(100% - 32px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:none;color:inherit;text-decoration:underline;font-weight:700;padding:6px 8px;border-radius:8px;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const PALETTE = ['#E2557A','#F08A3E','#D9A423','#3FAE7A','#2F9ED6','#6C63E0','#B05CD6','#1FA8A0'];
const EMOJIS = ['💡','⭐','❓','✅','⚠️','🎯','📌','🔥','🧠','❤️','💰','📅','🚀','📚','🛠️','✨'];
const KEY = 'nebulosa.v1', PKEY = 'nebulosa.prefs';
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const icon = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const short = (s, n = 28) => { s = (s || 'Nova ideia').replace(/\s+/g, ' '); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const isWide = () => matchMedia('(min-width: 700px)').matches;

/* ================= dados ================= */
let db = { maps: {} };
let prefs = { theme: 'system', panel: true, lastBackup: 0, seen: false };
let storageOk = true;

const WELCOME = `Ramifica
  💡 Comece aqui
    Toque numa ideia para selecionar
    Toque de novo para editar o texto
    Subideia cria um ramo para dentro
    Ao lado cria uma ideia irmã
  ✋ Gestos
    Arraste o fundo para passear
    Pinça com dois dedos para zoom
    Segure uma ideia para ver detalhes
    Arraste uma ideia sobre outra para mudá-la de lugar
  🌪️ Despejo rápido
    Uma ideia por linha
    Espaços no começo criam subideias
    > Bom para quando a mente está nebulosa: tire tudo da cabeça primeiro e organize depois.
  📱 Fold aberto
    Painel ao lado com detalhes e estrutura
    Mais espaço para o mapa crescer
  💾 Seus dados
    Ficam salvos só neste aparelho
    Faça backup no menu ⋯ da tela inicial`;

const TEMPLATES = [
  { name: 'Em branco', desc: 'Só a ideia central. Comece do zero.', text: 'Ideia central' },
  { name: 'Brainstorm', desc: 'Solte tudo e separe depois.', text: `Tema do brainstorm\n  Ideias rápidas\n  Ideias ousadas\n  Perguntas em aberto\n  Referências e inspirações` },
  { name: 'Projeto', desc: 'Objetivo, etapas, recursos e riscos.', text: `Meu projeto\n  🎯 Objetivo\n    Como vou saber que deu certo?\n  🗺️ Etapas\n    [ ] Etapa 1\n    [ ] Etapa 2\n    [ ] Etapa 3\n  🧰 Recursos\n    Pessoas\n    Ferramentas\n    Dinheiro\n  ⚠️ Riscos\n  📅 Prazos` },
  { name: 'Estudo', desc: 'Conceitos, exemplos e dúvidas de um assunto.', text: `Assunto\n  Conceitos principais\n  Exemplos\n  Regras e fórmulas\n  ❓ Dúvidas\n  [ ] Revisar` },
  { name: 'Decisão', desc: 'Opções lado a lado, com prós e contras.', text: `Decisão a tomar\n  Opção A\n    Prós\n    Contras\n  Opção B\n    Prós\n    Contras\n  Critérios que importam` },
  { name: 'Semana', desc: 'Dias, prioridades e pendências.', text: `Minha semana\n  ⭐ Prioridades\n  Segunda\n  Terça\n  Quarta\n  Quinta\n  Sexta\n  Fim de semana` },
  { name: 'Roda da vida', desc: 'Um olhar calmo para cada área da vida.', text: `Eu\n  Saúde\n  Trabalho\n  Finanças\n  Relacionamentos\n  Lazer\n  Aprendizado\n  Espiritualidade` },
];

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); storageOk = true; }
  catch (e) { if (storageOk) toast('Não consegui salvar neste aparelho. Exporte um backup para não perder nada.'); storageOk = false; }
}
let saveT = null;
function save(touch = true) { if (touch && M) M.updated = Date.now(); clearTimeout(saveT); saveT = setTimeout(persist, 350); }
function flush() { clearTimeout(saveT); persist(); }
function savePrefs() { try { localStorage.setItem(PKEY, JSON.stringify(prefs)); } catch (e) {} }
addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
addEventListener('pagehide', flush);

/* ---- texto em tópicos <-> ideias ---- */
function parseOutline(text) {
  const out = [], stack = [{ ind: -1, children: out }]; let last = null;
  for (const raw of String(text).replace(/\r/g, '').split('\n')) {
    if (!raw.trim()) continue;
    const ind = raw.match(/^\s*/)[0].replace(/\t/g, '    ').length;
    let t = raw.trim();
    if (/^>/.test(t) && last) { last.note = (last.note ? last.note + '\n' : '') + t.replace(/^>\s?/, ''); continue; }
    t = t.replace(/^#+\s+/, '').replace(/^([-*•+]|\d+[.)])\s+/, '');
    let done = null;
    const m = t.match(/^\[( |x|X)\]\s*/);
    if (m) { done = m[1] !== ' '; t = t.slice(m[0].length); }
    const item = { text: t, note: '', done, children: [] };
    while (stack.length > 1 && stack[stack.length - 1].ind >= ind) stack.pop();
    stack[stack.length - 1].children.push(item);
    stack.push({ ind, children: item.children });
    last = item;
  }
  return out;
}
function countItems(items) { return items.reduce((a, it) => a + 1 + countItems(it.children), 0); }
function newNode(text, parent) {
  return { id: uid(), text: text || '', parent, children: [], x: 0, y: 0, color: null, note: '', emoji: '', shape: 'auto', collapsed: false, done: null };
}
function addItems(m, parentId, items) {
  const p = m.nodes[parentId];
  for (const it of items) {
    const n = newNode(it.text, parentId);
    n.note = it.note || ''; n.done = it.done ?? null; n.x = p.x; n.y = p.y;
    m.nodes[n.id] = n; p.children.push(n.id);
    addItems(m, n.id, it.children);
  }
}
function mapFromOutline(text) {
  const items = parseOutline(text);
  const first = items[0] || { text: 'Ideia central', note: '', children: [] };
  const m = { id: uid(), created: Date.now(), updated: Date.now(), root: null, nodes: {}, links: [], view: null, auto: true, dir: 'both' };
  const r = newNode(first.text, null); r.note = first.note || '';
  m.root = r.id; m.nodes[r.id] = r;
  addItems(m, r.id, [...first.children, ...items.slice(1)]);
  const pos = computeLayout(m);
  for (const id in pos) Object.assign(m.nodes[id], pos[id]);
  return m;
}
function toOutline(m, id = m.root, d = 0) {
  const n = m.nodes[id];
  const box = n.done === true ? '[x] ' : n.done === false ? '[ ] ' : '';
  let s = d === 0 ? `# ${(n.emoji ? n.emoji + ' ' : '') + (n.text || 'Sem título').replace(/\n/g, ' ')}\n` :
    '  '.repeat(d - 1) + '- ' + box + (n.emoji ? n.emoji + ' ' : '') + (n.text || '…').replace(/\n/g, ' ') + '\n';
  if (n.note) s += n.note.split('\n').map(l => '  '.repeat(d) + '> ' + l).join('\n') + '\n';
  if (d === 0 && n.children.length) s += '\n';
  for (const c of n.children) s += toOutline(m, c, d + 1);
  return s;
}

/* ================= estado do editor ================= */
let M = null, sel = null, focusId = null, editorOpen = false;
let size = {}, elMap = new Map(), visible = [], visSet = new Set();
let undoStack = [], redoStack = [];
let edit = null, linkFrom = null;
let searchHits = new Set(), hitList = [], hitIdx = -1;
let curTab = 'ideia';
let tok = {};
const N = id => M.nodes[id];

const stageEl = $('#stage'), worldEl = $('#world'), nodesEl = $('#nodes'), edgesEl = $('#edges');
const panelEl = $('#panel'), bodyEl = $('#panel-body');

function readTokens() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['bg', 'surface', 'surface-2', 'ink', 'muted', 'line', 'accent']) tok[k] = cs.getPropertyValue('--' + k).trim();
}
function hexToRgb(h) { h = (h || '#888').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h.slice(0, 6), 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return '#' + A.map((v, i) => Math.round(v * t + B[i] * (1 - t)).toString(16).padStart(2, '0')).join(''); }
function onColor(h) { const [r, g, b] = hexToRgb(h); return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? '#141A26' : '#FFFFFF'; }

function colorOf(id, m = M) {
  let n = m.nodes[id];
  while (n) {
    if (n.color) return n.color;
    const p = n.parent && m.nodes[n.parent];
    if (p && !p.parent) return PALETTE[p.children.indexOf(n.id) % PALETTE.length];
    n = p;
  }
  return null;
}
function depth(id, m = M) { let d = 0, n = m.nodes[id]; while (n && n.parent) { d++; n = m.nodes[n.parent]; } return d; }
function subtree(id, acc = []) { acc.push(id); for (const c of N(id).children) subtree(c, acc); return acc; }
function isAncestor(a, b) { let n = N(b); while (n && n.parent) { if (n.parent === a) return true; n = N(n.parent); } return false; }
function countDesc(id) { return subtree(id).length - 1; }
function est(n) { const len = (n.emoji ? 2 : 0) + Math.min((n.text || 'Nova ideia').length, 34); return { w: Math.max(60, 30 + len * (n.parent ? 7.6 : 11)), h: n.parent ? 36 : 50 }; }
function sizeOf(id, m = M) { return (m === M && size[id]) || est(m.nodes[id]); }
function sideOf(id) { if (M.dir === 'down') return 0; return N(id).x < N(M.root).x ? -1 : 1; }

/* ================= layout automático ================= */
function computeLayout(m) {
  const pos = {}, r = m.nodes[m.root];
  const kids = n => n.collapsed ? [] : n.children;
  const S = id => sizeOf(id, m);
  if (m.dir === 'down') {
    const HG = 18, VG = 64, span = {};
    const sw = id => { const ks = kids(m.nodes[id]); const c = ks.length ? ks.reduce((a, k) => a + sw(k), 0) + HG * (ks.length - 1) : 0; return span[id] = Math.max(S(id).w, c); };
    sw(r.id);
    const place = (id, x, y) => {
      pos[id] = { x, y };

addEventListener('keydown', e => {

    wide: true,

      afterChange(); setTimeout(() => fit(true), 320);
      toast(`${countItems(items)} ideias adicionadas`);
    } }],
    onMount: () => {
      const ta = $('#dump-text'); ta.focus();
      const upd = () => { const c = countItems(parseOutline(ta.value)); $('#d-count').textContent = c ? `${c} ideia${c > 1 ? 's' : ''}` : ''; };
      ta.addEventListener('input', upd);
      const shift = dir => {
        const v = ta.value, st = ta.selectionStart, en = ta.selectionEnd;
        const ls = v.lastIndexOf('\n', st - 1) + 1;
        let le = v.indexOf('\n', en); if (le < 0) le = v.length;
        const block = v.slice(ls, le).split('\n').map(l => dir > 0 ? '  ' + l : l.replace(/^( {1,2}|\t)/, '')).join('\n');
        ta.value = v.slice(0, ls) + block + v.slice(le);
        const delta = block.length - (le - ls);

        ta.focus(); upd();

      $('#d-in').onclick = () => shift(1); $('#d-out').onclick = () => shift(-1);
    }
  });
}

async function deliver(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  if (!inFrame) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
    toast('Arquivo salvo em Downloads'); return;
  }
  if (blob.type.startsWith('image/')) {
    const url = URL.createObjectURL(blob);
    modal({ title: 'Imagem do mapa', html: `<p>Toque e segure a imagem para salvar ou compartilhar.</p><img class="preview-img" src="${url}" alt="Imagem do mapa mental">`, actions: [{ label: 'Fechar', kind: 'primary' }] });
  } else copyModal(name, await blob.text());
}
function copyModal(title, text) {
  modal({ title, html: `<p>Copie o conteúdo abaixo e cole onde quiser.</p><textarea id="copy-text" rows="12" readonly>${esc(text)}</textarea>`,
    actions: [{ label: 'Fechar' }, { label: 'Copiar', kind: 'primary', run: () => {
      const ta = $('#copy-text');
      navigator.clipboard?.writeText(text).then(() => toast('Copiado')).catch(() => { ta.focus(); ta.select(); toast('Selecionei o texto. Use Copiar do teclado.'); });
      return false;
    } }] });
}
const fileSafe = s => (s || 'mapa').replace(/[\\/:*?"<>|\n]+/g, ' ').trim().slice(0, 50) || 'mapa';

  copyModal('Lista de tópicos', text);
}

function exportBackup() {

  const d = new Date(), name = `ramifica-backup-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`;

function importText(text, fname) {

async function exportPNG() {
  if (edit) commitEdit();
  try { await document.fonts.ready; } catch (e) {}
  const ids = visible, bb = bbox(ids), pad = 48;
  const W = bb.w + pad * 2, H = bb.h + pad * 2;
  const scale = Math.min(2.5, 7000 / Math.max(W, H));
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(W * scale); cv.height = Math.ceil(H * scale);
  const ctx = cv.getContext('2d');
  ctx.scale(scale, scale); ctx.fillStyle = tok.bg; ctx.fillRect(0, 0, W, H);
  ctx.translate(pad - bb.x, pad - bb.y);

  for (const id of ids) {
    const n = N(id); if (!n.parent || !visSet.has(n.parent)) continue;
    ctx.strokeStyle = colorOf(id) || tok.ink; ctx.lineWidth = edgeWidth(depth(id));
    ctx.stroke(new Path2D(edgeD(n.parent, id)));

  ctx.save(); ctx.setLineDash([7, 7]); ctx.strokeStyle = tok.muted; ctx.lineWidth = 2;
  for (const L of M.links) if (visSet.has(L.a) && visSet.has(L.b)) ctx.stroke(new Path2D(linkD(L.a, L.b)));

    const el = elMap.get(id); if (!el) continue;

    else if (bbw > 0) { ctx.fillStyle = cs.borderBottomColor; ctx.fillRect(x, y + s.h - bbw, s.w, bbw); }
    for (const part of el.children) {
      if (part.classList.contains('txt') || part.classList.contains('emo')) {
        const pcs = getComputedStyle(part);
        ctx.font = `${pcs.fontWeight} ${pcs.fontSize} ${pcs.fontFamily}`;
        ctx.fillStyle = pcs.color; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
        const lh = parseFloat(pcs.lineHeight) || parseFloat(pcs.fontSize) * 1.3;
        const lines = wrapLines(ctx, part.textContent || (part.classList.contains('txt') ? '' : ''), part.offsetWidth + 1);
        const cx = x + part.offsetLeft + part.offsetWidth / 2;
        let ty = y + part.offsetTop + (part.offsetHeight - lines.length * lh) / 2 + lh / 2;
        if (n.done === true && part.classList.contains('txt')) ctx.globalAlpha = .6;
        for (const ln of lines) { ctx.fillText(ln, cx, ty); ty += lh; }
        ctx.globalAlpha = 1;
      } else if (part.classList.contains('chk')) {

        if (n.done) { ctx.fillStyle = c.borderTopColor; ctx.fill(); }

function wrapLines(ctx, text, maxW) {
  const out = [];

      else line = t;
    }
    out.push(line.trim());
  }
  return out;
}

/* ================= tela inicial ================= */
function ago(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'agora mesmo';
  if (s < 3600) return `há ${Math.floor(s / 60)} min`;
  if (s < 86400) return `há ${Math.floor(s / 3600)} h`;
  if (s < 172800) return 'ontem';
  if (s < 604800) return `há ${Math.floor(s / 86400)} dias`;
  return new Date(t).toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' });
}
function thumbSvg(m) {

  let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
  for (const id of ids) { const n = m.nodes[id], s = est(n); a = Math.min(a, n.x - s.w / 2); b = Math.min(b, n.y - s.h / 2); c = Math.max(c, n.x + s.w / 2); d = Math.max(d, n.y + s.h / 2); }

  for (const id of ids) { const n = m.nodes[id]; if (!n.parent) continue; const p = m.nodes[n.parent]; s += `<line x1="${p.x}" y1="${p.y}" x2="${n.x}" y2="${n.y}" stroke="${colorOf(id, m) || tok.ink}" stroke-width="${Math.max(3, w / 160)}" stroke-linecap="round"/>`; }
  for (const id of ids) { const n = m.nodes[id], e = est(n), col = colorOf(id, m) || tok.ink, root = !n.parent; s += `<rect x="${n.x - e.w / 2}" y="${n.y - e.h / 2}" width="${e.w}" height="${e.h}" rx="${e.h / 2}" fill="${root ? col : mix(col, tok.surface, 0.22)}" stroke="${col}" stroke-width="${root ? 0 : Math.max(2, w / 260)}"/>`; }
  return `<svg viewBox="${a} ${b} ${w} ${h}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${s}</svg>`;
}

$('#map-title').onclick = () => { reveal(M.root); centerOn(M.root); startEdit(M.root); };
$('#btn-undo').onclick = undo;
$('#btn-redo').onclick = redo;

/* ================= início ================= */
try { const p = JSON.parse(localStorage.getItem(PKEY) || 'null'); if (p) prefs = { ...prefs, ...p }; } catch (e) {}
try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d && d.maps) db = d; } catch (e) { storageOk = false; }
applyTheme();
if (!Object.keys(db.maps).length) { const m = mapFromOutline(WELCOME); m.welcome = true; db.maps[m.id] = m; persist(); }
renderHome();
if (!prefs.seen) {
  prefs.seen = true; savePrefs();
  const w = Object.values(db.maps).find(m => m.welcome) || Object.values(db.maps)[0];
  if (w) openMap(w.id);
} else if (location.hash === '#mapa') { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
try { document.fonts.ready.then(() => { if (M && editorOpen && !edit) { if (M.auto) relayout(false); else { renderNodes(); renderEdges(); } } }); } catch (e) {}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:' && !inFrame) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
